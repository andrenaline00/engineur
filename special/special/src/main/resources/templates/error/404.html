<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />


    <title>404 – Page Not Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0f1117; --accent: #4f8ef7; --accent-2: #7c5cfc;
            --text-1: #e8eaf0; --text-2: #8b93a8; --text-3: #5a6175;
            --border: #2a3245;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg); color: var(--text-1);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            overflow: hidden;
        }

        /* Floating background code */
        .bg-code {
            position: fixed; inset: 0; pointer-events: none;
            font-family: 'DM Mono', monospace; font-size: 13px;
            color: rgba(79,142,247,.05); line-height: 1.8;
            white-space: pre; overflow: hidden; z-index: 0;
            padding: 20px;
        }

        .container {
            position: relative; z-index: 1;
            max-width: 520px;
        }

        /* Giant 404 */
        .error-code {
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 900;
            letter-spacing: -8px;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-10px); }
        }

        .error-icon {
            font-size: 40px; margin-bottom: 20px;
            animation: wiggle 1.5s ease-in-out infinite;
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50%       { transform: rotate(5deg); }
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p  { font-size: 15px; color: var(--text-2); line-height: 1.6; margin-bottom: 32px; }

        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-home {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; text-decoration: none;
            padding: 11px 24px; border-radius: 9px;
            font-size: 14px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 7px;
            transition: opacity .15s;
        }
        .btn-home:hover { opacity: .85; color: #fff; }
        .btn-back {
            background: transparent;
            color: var(--text-2); text-decoration: none;
            padding: 10px 22px; border-radius: 9px;
            font-size: 14px; font-weight: 500;
            border: 1px solid var(--border);
            display: inline-flex; align-items: center; gap: 7px;
            transition: border-color .15s, color .15s;
        }
        .btn-back:hover { border-color: var(--accent); color: var(--accent); }

        /* Error path display */
        .error-path {
            margin-top: 32px;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 16px;
            font-family: 'DM Mono', monospace; font-size: 12px;
            color: var(--text-3);
        }
        .error-path .method { color: #f59e0b; margin-right: 8px; }
        .error-path .path { color: var(--text-2); }
        .error-path .status { color: #ef4444; margin-left: auto; }
        .path-row { display: flex; align-items: center; }
    </style>
</head>
<body>

<!-- Background code noise
<div class="bg-code" aria-hidden="true">
    GET /api/projects 404 Not Found
    GET /api/usecases 404 Not Found
    POST /api/diagrams 404 Not Found
    GET /resources/templates 404 Not Found
    GET /api/crc-cards 404 Not Found
    GET /api/users/profile 404 Not Found
    GET /api/projects/list 404 Not Found
</div> -->

<div class="container">
    <div class="error-code">404</div>
    <h1>Page not Found</h1>
    <p>
        The address does not exist<br/>
        Check URL or return to the dashboard.
    </p>

    <div class="actions">
        <a th:href="@{/dashboard}" class="btn-home">
            <i class="bi bi-house"></i> Dashboard
        </a>
        <a href="javascript:history.back()" class="btn-back">
            <i class="bi bi-arrow-left"></i> Πίσω
        </a>
    </div>

    <!-- Show the bad path if Spring provides it -->
    <div class="error-path" th:if="${path}">
        <div class="path-row">
            <span class="method">GET</span>
            <span class="path" th:text="${path}">/unknown/path</span>
            <span class="status ms-auto">404</span>
        </div>
    </div>
</div>

</body>
</html>
