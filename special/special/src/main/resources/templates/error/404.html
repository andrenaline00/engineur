<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="el">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>404 – Page Not Found</title>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="text-center">

        <h1 class="display-1 font-weight-bold text-pink mb-2">404</h1>
        <h2 class="mb-3">Page not Found</h2>

        <p class="text-muted mb-4">
            The address does not exist.<br/>
            Check the URL or return to the dashboard.
        </p>

        <div class="mb-4">
            <a th:href="@{/dashboard}" class="btn btn-primary mr-2">Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
        </div>

        <!-- Show the bad path if Spring provides it I think its uncecessay
        <div th:if="${path}" class="d-inline-block border rounded px-3 py-2 bg-light">
            <small class="text-muted">
                <strong class="text-pink">GET</strong>
                <span th:text="${path}">/unknown/path</span>
                <span class="text-danger ml-2">404</span>
            </small>
        </div> -->

    </div>
</div>

</body>
</html>
