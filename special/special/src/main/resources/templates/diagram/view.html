<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <title>Diagram — Special</title>
</head>
<body>
<div th:replace="~{layout/navigation :: navbar}"></div>

<div class="container py-5">
    <div class="card">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0 card-title" style="border:none;"
                    th:text="${diagramTitle}">Diagram</h2>
                <a th:href="@{/projects/{id}(id=${projectId})}" class="btn btn-outline-secondary btn-sm">
                    &larr; Back to Project
                </a>
            </div>

            <!-- Η εικόνα του διαγράμματος -->
            <div class="text-center bg-white p-3 rounded border" th:if="${imageUrl != null}">
                <img th:src="${imageUrl}" alt="Generated diagram" class="img-fluid"/>
            </div>

            <!-- Ο κώδικας του διαγράμματος (για debugging / αντιγραφή) -->
            <div class="mt-4" th:if="${diagramSource != null}">
                <label class="text-muted small text-uppercase font-weight-bold">Diagram Source</label>
                <pre class="bg-light p-3 rounded border" style="white-space: pre-wrap;"
                     th:text="${diagramSource}">source</pre>
            </div>

            <p th:if="${imageUrl == null and diagramSource == null}" class="text-muted">
                No diagram could be generated. Add some use cases or CRC cards first.
            </p>

        </div>
    </div>
</div>

<footer><small>&copy; 2026 Special Tools by Softies Team</small></footer>
</body>
</html>
