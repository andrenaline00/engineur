<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>Register — Special</title>
</head>
<body>

    <div class="header" style="text-align: center;" >
    <h1>S P E C I A L</h1>

    <hr>
    </div>

    <div th:replace="~{layout/navigation :: navbar}"></div>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm" style="width: 420px;">
        <div class="card-body p-4">

            <h2 class="card-title text-center mb-1">Create account</h2>
            <p class="text-center text-muted small mb-4">Join Special</p>

            <!-- Success message (e.g. coming back from redirect) -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

            <!-- Error message -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username"
                           th:field="*{username}" placeholder="your_handle" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email"
                           th:field="*{email}" placeholder="you@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password"
                           th:field="*{password}" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select class="form-control" id="role" th:field="*{role}" required>
                        <option value="">Select a role</option>
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">Create account</button>
            </form>

            <hr/>

            <p class="text-center mb-0">
                <small class="text-muted">Already have an account?
                    <a th:href="@{/login}" class="font-weight-bold">Sign in</a>
                </small>
            </p>

        </div>
    </div>
</div>

<!-- Footer -->
<footer class="container py-4 text-center">
    <hr/>
    <small class="text-muted">&copy; 2026 Special Tools by Softies Team</small>
</footer>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyRFnSvTuBQFAYnZlyAqCMD9factJTB6J5/OWTstVw5U8gZrHcUlAd3zcPostV" crossorigin="anonymous"></script>

</body>
</html>
