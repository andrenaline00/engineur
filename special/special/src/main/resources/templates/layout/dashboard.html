<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="Project Dashboard — Special"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
          integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>Dashboard | Special</title>
</head>

<body th:style="|background-image: url('@{/images/background.jpg}'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;|">
<div class="page-overlay">

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <a class="navbar-brand font-weight-bold mx-auto" th:href="@{/dashboard}">
        Special
    </a>
</nav>

<!-- Hero -->
<section class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="hero-tag">
                Dashboard
            </div>

            <h1 class="display-4 font-weight-bold mb-3">
                Your <span class="text-pink">Projects</span>
            </h1>

            <p class="lead text-muted mb-4">
                Manage software projects, organize use cases,
                and create CRC cards in one workspace.
            </p>

            <a th:href="@{/projects/new}" class="btn btn-primary btn-lg px-5">
                + Create New Project
            </a>

        </div>
    </div>
</section>

<!-- Projects Section -->
<section class="container pb-5">

    <!-- Empty State -->
    <!--
    <div class="text-center py-5">
        <h4 class="font-weight-bold">No projects yet</h4>
        <p class="text-muted">
            Start by creating your first project.
        </p>

        <a th:href="@{/projects/new}" class="btn btn-primary">
            Create Project
        </a>
    </div>
    -->

    <!-- Project Cards -->
    <div class="row">

        <!-- Example Project Card -->
        <div class="col-md-4 mb-4"
             th:each="project : ${projects}">

            <div class="project-card h-100 d-flex flex-column justify-content-between">

                <div>
                    <div class="project-icon">
                        📁
                    </div>

                    <h5 class="font-weight-bold mb-2"
                        th:text="${project.name}">
                        Project Name
                    </h5>

                    <p class="text-muted small mb-4"
                       th:text="${project.description}">
                        Project description goes here.
                    </p>
                </div>

                <div class="mt-auto">

                    <a th:href="@{/projects/{id}(id=${project.id})}"
                       class="btn btn-outline-primary btn-sm mr-2">
                        Open
                    </a>

                    <a th:href="@{/projects/{id}/usecases(id=${project.id})}"
                       class="btn btn-outline-secondary btn-sm mr-2">
                        Use Cases
                    </a>

                    <a th:href="@{/projects/{id}/crc(id=${project.id})}"
                       class="btn btn-outline-secondary btn-sm">
                        CRC Cards
                    </a>

                    <form th:action="@{/projects/delete/{id}(id=${project.id})}"
                          method="post"
                          class="mt-3">

                        <button type="submit"
                                class="btn btn-danger btn-sm btn-block">
                            Delete Project
                        </button>
                    </form>

                </div>
            </div>
        </div>

    </div>
</section>

<!-- Footer -->
<footer class="container py-4 text-center text-muted">
    <hr/>
    <small>&copy; 2026 Special Tools by Softies Team</small>
</footer>

</div>

<!-- Styling -->
<style>


    .hero-tag {
        display: inline-block;
        background: rgba(70, 29, 58, 0.1);
        color: var(--my-purple);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .project-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 14px;
        padding: 28px 22px;
        transition: transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .project-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 24px rgba(70, 29, 58, 0.08);
        border-color: var(--my-purple);
    }

    .project-icon {
        width: 50px;
        height: 50px;
        background: linear-gradient(
                135deg,
                var(--my-purple),
                var(--my-pink)
        );
        color: white;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        margin-bottom: 16px;
    }

    .btn-primary {
        border-radius: 10px;
    }

    .btn-outline-primary,
    .btn-outline-secondary,
    .btn-danger {
        border-radius: 8px;
    }

</style>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"
        integrity="sha384-B0UglyRFnSvTuBQFAYnZlyAqCMD9factJTB6J5/OWTstVw5U8gZrHcUlAd3zcPostV"
        crossorigin="anonymous"></script>

</body>
</html>
