<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>New Use Case | Special</title>

</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{layout/navigation :: navbar}"></div>

    <div class="mesh-bg"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">

                <a th:href="@{/projects/{id}(id=${project.id})}"
                    class="text-muted-alt text-decoration-none mb-4 d-inline-block">
                    &larr; Back to <span th:text="${project.name}">Project</span>
                </a>

                <div class="premium-card">
                    <h1 class="mb-2" style="color: var(--primary);">Create Use Case</h1>
                    <p class="text-muted mb-5">Define your system requirements with precision.</p>

                    <form th:action="@{/projects/{projectID}/usecases(projectID=${project.id})}" method="post">

                        <div class="form-group mb-4">
                            <label class="form-label">Use Case Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g., Authenticate User"
                                required>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0">Context & Scope</h2>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Preconditions</label>
                                <textarea name="preconditions" class="form-control" rows="3"
                                    placeholder="What must be true before this starts?"></textarea>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Postconditions</label>
                                <textarea name="postconditions" class="form-control" rows="3"
                                    placeholder="What will be true after successful completion?"></textarea>
                            </div>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0">Behaviors</h2>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Main Success Flow</label>
                            <textarea name="mainFlow" class="form-control" rows="6"
                                placeholder="1. User enters credentials...&#10;2. System validates..."></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Alternative Flows / Errors</label>
                            <textarea name="altFlows" class="form-control" rows="4"
                                placeholder="If validation fails..."></textarea>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0">Involved Actors</h2>
                        </div>

                        <div class="mb-5">
                            <div th:if="${#lists.isEmpty(actors)}" class="text-muted small italic">
                                No actors defined in this project. <a
                                    th:href="@{/projects/{id}/actors/new(id=${project.id})}">Create one first?</a>
                            </div>
                            <div class="d-flex flex-wrap">
                                <label th:each="actor : ${actors}" class="actor-checkbox mr-2">
                                    <input type="checkbox" name="actorIds" th:value="${actor.id}">
                                    <span th:text="${actor.name}">Actor Name</span>
                                </label>
								<a         th:href="@{/projects/{id}/actors/new(id=${project.id})}">Create another actor</a>
                            </div>
                        </div>

                        <div class="pt-4 border-top border-glass d-flex justify-content-between align-items-center">
                            <button type="submit" class="btn btn-premium">Create Use Case</button>
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="text-muted">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyRFnSvTuBQFAYnZlyAqCMD9factJTB6J5/OWTstVw5U8gZrHcUlAd3zcPostV" crossorigin="anonymous"></script>
</body>

</html>
