<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>Special | Use Case Form</title>
</head>
<body>
    <!-- Reusable use-case form fields. Pass the useCase object (or null for create). -->
    <div th:fragment="ucFields(useCase, actors)">

        <div class="form-group">
            <label for="title">Title <span class="text-pink">*</span></label>
            <input type="text" class="form-control" id="title" name="title"
                   th:value="${useCase != null} ? ${useCase.title} : ''"
                   placeholder="e.g. Define use cases for a project" required>
        </div>

        <div class="form-group">
            <label for="preconditions">Preconditions</label>
            <textarea class="form-control" id="preconditions" name="preconditions" rows="2"
                      placeholder="What must be true before this use case runs"
                      th:text="${useCase != null} ? ${useCase.preconditions} : ''"></textarea>
        </div>

        <div class="form-group">
            <label for="mainFlow">Main Flow</label>
            <textarea class="form-control" id="mainFlow" name="mainFlow" rows="4"
                      placeholder="Step-by-step main scenario"
                      th:text="${useCase != null} ? ${useCase.mainFlow} : ''"></textarea>
        </div>

        <div class="form-group">
            <label for="altFlows">Alternative Flows</label>
            <textarea class="form-control" id="altFlows" name="altFlows" rows="3"
                      placeholder="Exceptions and alternative paths"
                      th:text="${useCase != null} ? ${useCase.altFlows} : ''"></textarea>
        </div>

        <div class="form-group">
            <label for="postconditions">Postconditions</label>
            <textarea class="form-control" id="postconditions" name="postconditions" rows="2"
                      placeholder="What is true after this use case completes"
                      th:text="${useCase != null} ? ${useCase.postconditions} : ''"></textarea>
        </div>

        <!-- Actors — multi-select -->
        <div class="form-group">
            <label for="actorIds">Actors</label>
            <select multiple class="form-control" id="actorIds" name="actorIds" size="4">
                <option th:each="actor : ${actors}"
                        th:value="${actor.id}"
                        th:text="${actor.name}"
                        th:selected="${useCase != null and useCase.actors != null and useCase.actors.contains(actor)}">
                    Actor name
                </option>
            </select>
            <small class="form-text text-muted">Hold Ctrl (Cmd on Mac) to select multiple.</small>
        </div>

    </div>

</body>
</html>
