<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — ReqSpec</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        /* ── Reset & Variables ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07050f;
            --surface: #0e0a1a;
            --surface2: #150f26;
            --surface3: #1a1230;
            --border: rgba(120, 60, 220, 0.25);
            --border-hi: rgba(160, 90, 255, 0.6);
            --purple: #a05cff;
            --purple-lo: rgba(160, 92, 255, 0.12);
            --purple-md: rgba(160, 92, 255, 0.35);
            --violet: #6b21e8;
            --text: #d4c8f0;
            --muted: #6a5a8a;
            --white: #f0eaff;
            --gold: #c9a84c;
            --green: #4ade80;
            --red: #e8274b;
        }

        body {
            background: var(--bg);
            font-family: 'Syne', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Noise texture */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.028;
            pointer-events: none;
            z-index: 999;
        }

        /* Ambient glow blobs */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(107, 33, 232, 0.2) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        /* ── Back link ── */
        .back-link {
            position: fixed;
            top: 28px;
            left: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s;
            z-index: 10;
        }

        .back-link:hover {
            color: var(--purple);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        /* ── Profile Container ── */
        .profile-container {
            width: 100%;
            max-width: 520px;
            position: relative;
        }

        /* ── Avatar Section ── */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
            position: relative;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 0deg, var(--purple), var(--violet), var(--purple));
            margin-bottom: 20px;
            position: relative;
            animation: ringRotate 6s linear infinite;
        }

        @keyframes ringRotate {
            to {
                filter: hue-rotate(20deg);
            }
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--surface);
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        .avatar-inner svg {
            width: 44px;
            height: 44px;
            stroke: var(--purple);
            opacity: 0.7;
        }

        .avatar-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(160, 92, 255, 0.25) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .user-display-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: -0.5px;
        }

        .user-role {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--purple);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-role::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }

        /* ── Card ── */
        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(107, 33, 232, 0.15) 0%, transparent 70%);
            top: -120px;
            right: -80px;
            pointer-events: none;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(120, 60, 220, 0.1);
            border-radius: 50%;
            bottom: -80px;
            left: -60px;
            pointer-events: none;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 0.5px;
        }

        .card-badge {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--purple);
            background: var(--purple-lo);
            border: 1px solid rgba(160, 92, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* ── Form fields ── */
        .field {
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .field-wrap {
            position: relative;
        }

        .field-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--muted);
            pointer-events: none;
            transition: stroke 0.2s;
        }

        .field-wrap:focus-within svg {
            stroke: var(--purple);
        }

        .field-wrap input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            padding: 14px 14px 14px 44px;
            outline: none;
            transition: all 0.25s;
        }

        .field-wrap input::placeholder {
            color: #3d2f5e;
        }

        .field-wrap input:focus {
            border-color: var(--border-hi);
            background: var(--surface3);
            box-shadow: 0 0 0 3px rgba(160, 92, 255, 0.1);
        }

        .field-hint {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            margin-top: 6px;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 28px 0;
            position: relative;
            z-index: 1;
        }

        /* ── Alerts ── */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(74, 222, 128, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.25);
            color: var(--green);
        }

        .alert-error {
            background: rgba(232, 39, 75, 0.08);
            border: 1px solid rgba(232, 39, 75, 0.25);
            color: var(--red);
        }

        .alert svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ── Button ── */
        .btn-primary {
            width: 100%;
            background: var(--violet);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 24px rgba(107, 33, 232, 0.4);
            z-index: 1;
            margin-top: 8px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent);
            pointer-events: none;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .btn-primary:hover {
            background: var(--purple);
            box-shadow: 0 4px 36px rgba(160, 92, 255, 0.55);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ── Stats row ── */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 36px;
        }

        .stat-card {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 16px;
            text-align: center;
            transition: border-color 0.2s, transform 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--white);
            line-height: 1;
        }

        .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ── Danger zone ── */
        .danger-section {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(232, 39, 75, 0.15);
            position: relative;
            z-index: 1;
        }

        .danger-title {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .btn-danger {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(232, 39, 75, 0.3);
            border-radius: 10px;
            color: var(--red);
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: rgba(232, 39, 75, 0.1);
            border-color: rgba(232, 39, 75, 0.5);
            box-shadow: 0 0 20px rgba(232, 39, 75, 0.15);
        }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            .profile-card {
                padding: 28px 20px;
            }

            .stats-row {
                flex-direction: column;
            }

            .avatar-ring {
                width: 90px;
                height: 90px;
            }

            .user-display-name {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Back to Dashboard -->
    <a th:href="@{/dashboard}" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Dashboard
    </a>

    <div class="profile-container">

        <!-- Avatar & User Info -->
        <div class="avatar-section">
            <div class="avatar-glow"></div>
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            </div>
            <span class="user-display-name" th:text="${user.username}">Username</span>
            <span class="user-role">Active Account</span>
        </div>

        <!-- Profile Card -->
        <div class="profile-card">

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
                <span th:text="${success}">Profile updated successfully!</span>
            </div>

            <div th:if="${error}" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="15" y1="9" x2="9" y2="15" />
                    <line x1="9" y1="9" x2="15" y2="15" />
                </svg>
                <span th:text="${error}">An error occurred.</span>
            </div>

            <!-- Header -->
            <div class="card-header-row">
                <span class="card-title">Edit Profile</span>
                <span class="card-badge">Account Settings</span>
            </div>

            <!-- Form -->
            <form th:action="@{/profile}" method="post" id="profileForm">
                <input type="hidden" th:value="${user.id}" name="id" />

                <!-- Username -->
                <div class="field">
                    <label for="profile-username">Username</label>
                    <div class="field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="profile-username" name="username" th:value="${user.username}"
                            placeholder="Enter username" required />
                    </div>
                </div>

                <!-- Email -->
                <div class="field">
                    <label for="profile-email">Email Address</label>
                    <div class="field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                        </svg>
                        <input type="email" id="profile-email" name="email" th:value="${user.email}"
                            placeholder="Enter email" required />
                    </div>
                </div>

                <div class="divider"></div>

                <!-- New Password -->
                <div class="field">
                    <label for="profile-password">New Password</label>
                    <div class="field-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="profile-password" name="password"
                            placeholder="Leave blank to keep current" />
                    </div>
                    <div class="field-hint">Min. 8 characters recommended</div>
                </div>

                <button type="submit" class="btn-primary">Save Changes</button>
            </form>

            <!-- Danger Zone -->
            <div class="danger-section">
                <div class="danger-title">Danger Zone</div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-danger">Sign Out of Account</button>
                </form>
            </div>

        </div>
    </div>

</body>

</html>
