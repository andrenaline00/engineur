<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>New CRC Card — Special</title>
</head>

<body th:style="|background-image: url('@{/images/crc.jpg}'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;|">

    <nav class="navbar navbar-dark">
        <a class="navbar-brand font-weight-bold mx-auto" th:href="@{/}">Special</a>
    </nav>
    <a th:href="@{/projects/{id}(id=${project.id})}"
                    class="text-muted text-decoration-none mb-4 d-inline-block">
                    &larr; Back to <span th:text="${project.name}">Project</span>
                </a>

    <div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, rgba(248, 245, 255, 0.72) 0%, rgba(255, 255, 255, 0.62) 45%, rgba(253, 242, 248, 0.72) 100%);">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                    <div class="card border-0 shadow-lg overflow-hidden">
                        <div class="card-header text-white py-4" style="background: linear-gradient(135deg, var(--my-purple) 0%, var(--my-pink) 100%);">
                            <small class="d-block text-uppercase font-weight-bold mb-1" style="letter-spacing: .12em; opacity: .85;">Special workspace</small>
                            <h1 class="h3 mb-1">Create a new CRC Card</h1>
                            <p class="mb-0" style="opacity: .9;">Define Class, Responsibility, and Collaboration mapping.</p>
                        </div>

                        

                            <form th:action="@{/projects/{projectID}/crccards(projectID=${project.id})}" method="post">
                                <div class="form-group">
                                   <label class="font-weight-bold">Class Name</label>
                                    <input type="text" name="className" class="form-control" placeholder="e.g., User" required>
                                </div>


                                <div class="form-group mb-4">
                                 <label class="font-weight-bold">Responsibilities</label>
                                 <textarea name="responsibilities" class="form-control" rows="4"
                                placeholder="What is this class supposed to do?"></textarea>
                                 </div>

                                 <div class="form-group mb-4">
                            <label class="font-weight-bold">Collaborations</label>
                            <textarea name="collaborations" class="form-control" rows="4"
                                placeholder="Which other classes does this communicate with?"></textarea>
                        </div>

                                                        <div class="section-header">
                            <h2 class="h5 mb-0 text-pink">Linked Use Cases</h2>
                        </div>

                        <div class="mb-5">
                            <div th:if="${#lists.isEmpty(useCases)}" class="text-muted small italic">
                                No use cases defined in this project.
                            </div>
                            <div class="d-flex flex-wrap gap-2">
                                <label th:each="uc : ${useCases}" class="uc-toggle mr-2">
                                    <input type="checkbox" name="useCaseIds" th:value="${uc.id}">
                                    <span th:text="${uc.title}">Use Case Title</span>
                                </label>
                            </div>
                        </div>

                        <div class="pt-4 border-top d-flex justify-content-between align-items-center"
                            style="border-color: var(--my-pink) !important;">
                            <button type="submit" class="btn btn-primary">Save CRC Card</button>
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="text-muted">Cancel</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Footer -->
    <footer class="container py-4 text-center">
        <hr/>
        <small class="text-muted">&copy; 2026 Special Tools by Softies Team</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyRFnSvTuBQFAYnZlyAqCMD9factJTB6J5/OWTstVw5U8gZrHcUlAd3zcPostV" crossorigin="anonymous"></script>

</body>


</html>
