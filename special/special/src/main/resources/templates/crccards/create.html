<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>New CRC Card | Special</title>

    <style>
        .premium-card {
            background: rgba(245, 237, 228, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(70, 29, 58, 0.15);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(70, 29, 58, 0.25);
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid rgba(70, 29, 58, 0.2);
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--my-purple) !important;
            box-shadow: 0 0 0 4px rgba(70, 29, 58, 0.1) !important;
        }

        .uc-toggle {
            background: rgba(70, 29, 58, 0.05);
            border: 1px solid rgba(70, 29, 58, 0.1);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--my-purple);
        }

        .uc-toggle:hover {
            border-color: var(--my-pink);
            background: rgba(59, 0, 22, 0.05);
        }

        .uc-toggle input {
            display: none;
        }

        .uc-toggle:has(input:checked) {
            background: var(--my-purple);
            color: #fff;
            box-shadow: 0 4px 12px rgba(70, 29, 58, 0.3);
        }

        .section-header {
            border-left: 3px solid var(--my-pink);
            padding-left: 1rem;
            margin: 2rem 0 1.5rem;
        }
    </style>
</head>

<body
    th:style="|background-image: url('@{/images/background.jpg}'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;|">

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <a class="navbar-brand font-weight-bold mx-auto" th:href="@{/}">Special</a>
    </nav>

    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">

                <a th:href="@{/projects/{id}(id=${project.id})}"
                    class="text-muted text-decoration-none mb-4 d-inline-block">
                    &larr; Back to <span th:text="${project.name}">Project</span>
                </a>

                <div class="premium-card">
                    <h1 class="mb-2 text-pink">New CRC Card</h1>
                    <p class="text-muted mb-5">Define Class, Responsibility, and Collaboration mapping.</p>

                    <form th:action="@{/projects/{projectID}/crccards(projectID=${project.id})}" method="post">

                        <div class="form-group mb-4">
                            <label class="form-label">Class Name</label>
                            <input type="text" name="className" class="form-control" placeholder="e.g., User" required>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0 text-pink">Core Attributes</h2>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Responsibilities</label>
                            <textarea name="responsibilities" class="form-control" rows="4"
                                placeholder="What is this class supposed to do?"></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Collaborations</label>
                            <textarea name="collaborations" class="form-control" rows="4"
                                placeholder="Which other classes does this communicate with?"></textarea>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0 text-pink">Linked Use Cases</h2>
                        </div>

                        <div class="mb-5">
                            <div th:if="${#lists.isEmpty(useCases)}" class="text-muted small italic">
                                No use cases defined in this project.
                            </div>
                            <div class="d-flex flex-wrap gap-2">
                                <label th:each="uc : ${useCases}" class="uc-toggle mr-2">
                                    <input type="checkbox" name="useCaseIds" th:value="${uc.id}">
                                    <span th:text="${uc.title}">Use Case Title</span>
                                </label>
                            </div>
                        </div>

                        <div class="pt-4 border-top d-flex justify-content-between align-items-center"
                            style="border-color: var(--my-pink) !important;">
                            <button type="submit" class="btn btn-primary px-4">Save CRC Card</button>
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="text-muted">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="container py-4 text-center">
        <hr />
        <small class="footer-text">&copy; 2026 Special Tools by Softies Team</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"></script>
</body>

</html>
