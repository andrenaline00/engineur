<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>Edit CRC Card | Special</title>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --accent: #ec4899;
            --bg-light: #f5f3ff;
            --border-soft: #e2e8f0;
        }

        body {
            background-color: var(--bg-light);
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(124, 58, 237, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.1);
        }

        h1,
        h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }

        .form-control {
            background: #fff;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            color: #1e293b;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            outline: none;
        }

        .form-label {
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.5);
        }

        .section-header {
            border-left: 3px solid var(--primary);
            padding-left: 1rem;
            margin: 2rem 0 1.5rem;
        }

        .uc-toggle {
            background: var(--bg-light);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #64748b;
        }

        .uc-toggle:hover {
            border-color: var(--primary-light);
            background: #fdf2f8;
        }

        .uc-toggle input {
            display: none;
        }

        .uc-toggle:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">

                <a th:href="@{/projects/{id}(id=${project.id})}"
                    class="text-muted text-decoration-none mb-4 d-inline-block">
                    &larr; Back to <span th:text="${project.name}">Project</span>
                </a>

                <div class="premium-card">
                    <h1 class="mb-2" style="color: var(--primary);">Edit CRC Card</h1>
                    <p class="text-muted mb-5">Refine the specifications for "<span
                            th:text="${crcCard.className}">Class</span>".</p>

                    <form th:action="@{/projects/{projectID}/crccards/{id}(projectID=${project.id}, id=${crcCard.id})}"
                        method="post">

                        <div class="form-group mb-4">
                            <label class="form-label">Class Name</label>
                            <input type="text" name="className" class="form-control" th:value="${crcCard.className}"
                                required>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0">Core Attributes</h2>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Responsibilities</label>
                            <textarea name="responsibilities" class="form-control" rows="4"
                                th:text="${crcCard.responsibilities}"></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Collaborations</label>
                            <textarea name="collaborations" class="form-control" rows="4"
                                th:text="${crcCard.collaborations}"></textarea>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0">Linked Use Cases</h2>
                        </div>

                        <div class="mb-5">
                            <div class="d-flex flex-wrap gap-2">
                                <label th:each="uc : ${useCases}" class="uc-toggle mr-2">
                                    <input type="checkbox" name="useCaseIds" th:value="${uc.id}"
                                        th:checked="${crcCard.useCases.contains(uc)}">
                                    <span th:text="${uc.title}">Use Case Title</span>
                                </label>
                            </div>
                        </div>

                        <div class="pt-4 border-top border-soft d-flex justify-content-between align-items-center">
                            <button type="submit" class="btn btn-premium">Save Changes</button>
                            <a th:href="@{/projects/{id}(id=${project.id})}" class="text-muted">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
