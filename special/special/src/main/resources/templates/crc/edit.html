<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <title>Edit CRC Card | Special</title>

    
</head>

<body
    th:style="|background-image: url('@{/images/crcedit.JPG}'); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;|">

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <a class="navbar-brand font-weight-bold mx-auto" th:href="@{/}">Special</a>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">

                <a th:href="@{/projects/{id}(id=${project.id})}"
                    class="text-muted text-decoration-none mb-4 d-inline-block">
                    &larr; Back to <span th:text="${project.name}">Project</span>
                </a>

                <div class="premium-card">
                    <h1 class="h3 mb-1">Edit CRC Card</h1>
                    <p class="mb-0" style="opacity: .9;">Refine the specifications for "<span
                            th:text="${crcCard.getclassname()}">Class</span>".</p>

                    <form th:action="@{/projects/{projectID}/crccards/{id}(projectID=${project.id}, id=${crcCard.id})}"
                        method="post">

                        <div class="form-group mb-4">
                            <label class="font-weight-bold" style="color: var(--my-purple);">Class Name</label>
                            <input type="text" name="className" class="form-control"
                                th:value="${crcCard.getclassname()}" required>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0 text-pink">Core Attributes</h2>
                        </div>

                        <div class="form-group mb-4">
                            <label class="font-weight-bold" style="color: var(--my-purple);">Responsibilities</label>
                            <textarea name="responsibilities" class="form-control" rows="4"
                                th:text="${crcCard.responsibilities}"></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label class="font-weight-bold" style="color: var(--my-purple);">Collaborations</label>
                            <textarea name="collaborations" class="form-control" rows="4"
                                th:text="${crcCard.collaborations}"></textarea>
                        </div>

                        <div class="section-header">
                            <h2 class="h5 mb-0 text-pink">Linked Use Cases</h2>
                        </div>

                        <div class="mb-5">
                            <div class="d-flex flex-wrap gap-2">
                                <label th:each="uc : ${useCases}" class="uc-toggle mr-2">
                                    <input type="checkbox" name="useCaseIds" th:value="${uc.id}"
                                        th:checked="${crcCard.useCases.contains(uc)}">
                                    <span th:text="${uc.title}">Use Case Title</span>
                                </label>
                            </div>
                            <div th:if="${#lists.isEmpty(useCases)}" class="text-muted small italic">
                                No use cases configured for this project.
                            </div>
                        </div>

                        <div class="pt-4 border-top d-flex justify-content-between align-items-center"
                            style="border-color: var(--my-pink) !important;">
                            <div>
                                <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                                <a th:href="@{/projects/{id}(id=${project.id})}" class="ml-3 text-muted">Cancel</a>
                            </div>
                        </div>
                    </form>

                    <div class="mt-5 pt-4 border-top" style="border-color: rgba(0,0,0,0.1) !important;">
                        <h5 class="text-danger font-weight-bold">Dangerous Zone</h5>
                        <p class="text-muted small">Once deleted, this CRC card cannot be recovered.</p>
                        <form
                            th:action="@{/projects/{projectID}/crccards/{id}/delete(projectID=${project.id}, id=${crcCard.id})}"
                            method="POST" onsubmit="return confirm('Are you sure you want to delete this CRC Card?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Delete CRC Card</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="container py-4 text-center">
        <hr />
        <small class="footer-text">&copy; 2026 Special Tools by Softies Team</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"></script>
</body>

</html>
