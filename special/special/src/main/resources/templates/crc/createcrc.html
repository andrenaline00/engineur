<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <title>CRC Create</title>
</head>
<body>

    <div class="header" >
    <h1>S P E C I A L</h1>
    
    <hr>
    </div>

        <div class="hero">
            
            <h2 style="text-align:center;" th:text="${project.name}">Project Name</h2>
            <h1 class="p2" >Define CRC (Class-Responsibility-Collaboration) cards to feel organized and map out your project.</h1>
        </div>

        
    </div>

    <div class="right">
        <div class="p1">
            <h1 class="p1" style="text-align:center;" class="form-title">New CRC Card</h1>
          

            <form th:action="@{/projects/{projectID}/crccards(projectID=${project.id})}" method="POST">
                
                <div class="field">
                    <label for="className">Class Name</label>
                    <div class="field-wrap">
                        <input type="text" id="className" name="className" placeholder="e.g., CRCCard" required autocomplete="off">
                    </div>
                </div>

                <div class="field">
                    <label for="responsibilities">Responsibilities</label>
                    <div class="field-wrap">
                        <textarea id="responsibilities" name="responsibilities" rows="3" placeholder="What is this class supposed to do?" style="width:100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-family: 'DM Mono', monospace; font-size: 13px; padding: 13px; outline: none; transition: all 0.2s; resize: vertical;"></textarea>
                    </div>
                </div>

                <div class="field">
                    <label for="collaborations">Collaborations</label>
                    <div class="field-wrap">
                        <textarea id="collaborations" name="collaborations" rows="3" placeholder="Which other stuff this class communicates?" style="width:100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--white); font-family: 'DM Mono', monospace; font-size: 13px; padding: 13px; outline: none; transition: all 0.2s; resize: vertical;"></textarea>
                    </div>
                </div>

                <div class="field">
                    
                    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; max-height: 160px; overflow-y: auto;">
                        <div th:each="uc : ${useCases}" class="check-row" style="margin-bottom: 10px; justify-content: flex-start; gap: 10px;">
                            <input type="checkbox" name="useCaseIds" th:value="${uc.id}" th:id="'uc-' + ${uc.id}">
                            <label th:for="'uc-' + ${uc.id}" th:text="${uc.title}" style="margin-bottom:0; text-transform:none; font-family:'DM Mono', monospace; color: var(--text);"></label>
                        </div>
                        <div th:if="${#lists.isEmpty(useCases)}" style="font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted);">
                            No use cases currently configured for this project.
                        </div>
                    </div>
                </div>

                <button type="submit" class="button50" style="margin-top: 10px;">Save CRC Card</button>
                
                <div class="terms">
                    <a th:href="@{/projects/{id}(id=${project.id})}">Cancel and Return</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
